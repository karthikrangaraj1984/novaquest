{% macro starters(target) %}<div class="row starters" role="group" aria-label="Quick starters">{% for t in ["Great effort! ", "You clearly understand this. ", "Please revise this topic: ", "Try teaching NOVA this topic to make it stick. ", "Come and see me if anything is unclear. "] %}<button class="chip" type="button" data-insert="{{ target }}" data-text="{{ t }}">{{ t.strip() }}</button>{% endfor %}</div>{% endmacro %}
