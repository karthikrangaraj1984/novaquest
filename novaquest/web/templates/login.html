{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<main id="main" class="auth">
  <span class="brand">Nova<b style="color:var(--primary)">Quest</b></span>
  <div class="stack-sm"><h1>Sign in</h1><p class="muted">For teachers, principals, HODs and school admins.</p></div>
  {% if flash %}<div class="flash" role="status">{{ flash }}</div>{% endif %}
  {% if error %}<div class="note warn" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="card stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username" value="{{ email }}"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn block" type="submit">Sign in</button>
  </form>
  <p class="small muted">Student? <a href="/login/student">Sign in with your login slip</a></p>
</main>
{% endblock %}
